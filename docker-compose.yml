services:
  cloudsecops:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudsecops:local
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_PROFILE: ${AWS_PROFILE:-cloudsecops}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
    volumes:
      - reports:/app/reports
      - ${USERPROFILE}/.aws:/home/app/.aws:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  reports:
